services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: germani-bot:latest
    container_name: germani-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DB_PATH: /var/lib/bot/bot_database.db
    volumes:
      - bot_runtime:/var/lib/bot
    stop_grace_period: 30s

volumes:
  bot_runtime:
    name: germani_bot_runtime
